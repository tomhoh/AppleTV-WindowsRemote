name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to package (e.g. 0.1.0). Used when running ad-hoc.'
        required: true
        default: '0.0.0'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(?<ver>\d+\.\d+\.\d+)$') {
            $ver = $Matches.ver
          } elseif ('${{ inputs.version }}') {
            $ver = '${{ inputs.version }}'
          } else {
            $ver = '0.0.0'
          }
          # MSIX requires four-part version a.b.c.d
          $msixVer = "$ver.0"
          "version=$ver"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msix_version=$msixVer"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version    = $ver"
          Write-Host "MSIX ver   = $msixVer"

      # ─── Publish the WPF tray app (unpackaged self-contained EXE) ───
      - name: Publish WPF (win-x64 self-contained, single-file)
        shell: pwsh
        run: |
          dotnet publish src/AppleTVRemote.Windows/AppleTVRemote.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:DebugType=embedded `
            -o publish/wpf

      - name: Zip unpackaged WPF EXE
        shell: pwsh
        run: |
          $zip = "AppleTVRemote-Windows-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip"
          Compress-Archive -Path publish/wpf/* -DestinationPath $zip -Force
          "WPF_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ─── Publish the CLI (self-contained, single-file) ───
      - name: Publish CLI (win-x64 self-contained, single-file)
        shell: pwsh
        run: |
          dotnet publish src/AppleTVRemote.CLI/AppleTVRemote.CLI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:DebugType=embedded `
            -o publish/cli

      - name: Zip CLI
        shell: pwsh
        run: |
          $zip = "AppleTVRemote-CLI-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip"
          Compress-Archive -Path publish/cli/* -DestinationPath $zip -Force
          "CLI_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ─── Publish the WinUI 3 tray app (self-contained, win-x64) ───
      # WinUI 3 doesn't support PublishSingleFile reliably (XAML metadata
      # interop breaks), so we ship the publish folder zipped instead.
      - name: Publish WinUI (win-x64 self-contained)
        shell: pwsh
        run: |
          dotnet publish src/AppleTVRemote.WinUI/AppleTVRemote.WinUI.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:DebugType=embedded `
            -o publish/winui

      - name: Zip unpackaged WinUI app
        shell: pwsh
        run: |
          $zip = "AppleTVRemote-WinUI-${{ steps.ver.outputs.version }}-win-x64-selfcontained.zip"
          Compress-Archive -Path publish/winui/* -DestinationPath $zip -Force
          "WINUI_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ─── Build the MSIX package by wrapping the published WPF folder ───
      - name: Stage MSIX layout
        shell: pwsh
        run: |
          $stage = 'publish/msix'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # Copy the published WPF binaries into the package root
          Copy-Item -Recurse -Force 'publish/wpf/*' $stage
          # Generate placeholder assets
          ./packaging/GenerateAssets.ps1 -OutputDir (Join-Path $stage 'Assets')
          # Stamp version into the manifest
          $manifest = Get-Content -Raw packaging/Package.appxmanifest
          $manifest = $manifest -replace '#PACKAGE_VERSION#', '${{ steps.ver.outputs.msix_version }}'
          $manifest | Set-Content -Encoding UTF8 (Join-Path $stage 'AppxManifest.xml')
          Get-ChildItem -Recurse $stage | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Locate MakeAppx and signtool
        id: sdk
        shell: pwsh
        run: |
          # PowerShell needs ${env:NAME} for env-var names that contain
          # special chars like "(x86)" — $env:ProgramFiles(x86) parses
          # as "$env:ProgramFiles" + "(x86)" and loses the space.
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $kits)) {
            # Fallback to %ProgramFiles%\Windows Kits\10\bin (some runner images use this)
            $kits = "${env:ProgramFiles}\Windows Kits\10\bin"
          }
          if (-not (Test-Path $kits)) { throw "Windows SDK bin not found in either ProgramFiles location" }
          Write-Host "Scanning $kits for MakeAppx/signtool …"
          $binDir = Get-ChildItem $kits -Directory `
                    | Where-Object { Test-Path (Join-Path $_.FullName 'x64\makeappx.exe') } `
                    | Sort-Object Name -Descending `
                    | Select-Object -First 1 `
                    | ForEach-Object { Join-Path $_.FullName 'x64' }
          if (-not $binDir) { throw "MakeAppx.exe not found under $kits" }
          Write-Host "Using $binDir"
          "makeappx=$binDir\makeappx.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signtool=$binDir\signtool.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack MSIX
        shell: pwsh
        run: |
          $msix = "AppleTVRemote-Windows-${{ steps.ver.outputs.version }}-win-x64.msix"
          & '${{ steps.sdk.outputs.makeappx }}' pack /d publish/msix /p $msix /o
          "MSIX_FILE=$msix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate self-signed cert and sign WPF MSIX
        shell: pwsh
        run: |
          # The Identity Publisher in the manifest must match this Subject EXACTLY.
          $subject = 'CN=Tom Hohensee'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -KeyUsage DigitalSignature `
            -FriendlyName 'AppleTV-WindowsRemote dev signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $pwd  = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          $pfx  = 'devcert.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          # Also export the public cert so end-users can trust it before installing the MSIX
          $cer = "AppleTVRemote-Windows-${{ steps.ver.outputs.version }}-publisher.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          "PUB_CERT=$cer"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "DEV_PFX=$pfx"       | Out-File -FilePath $env:GITHUB_ENV -Append
          # Stash the password too so the WinUI signing step doesn't re-mint.
          # (Workflow secrets are unavailable for sideloading; the cert is
          # transient and exists only for this run, so the plaintext password
          # in GITHUB_ENV is fine here.)
          $plainPwd = [System.Net.NetworkCredential]::new('', $pwd).Password
          "DEV_PFX_PWD=$plainPwd" | Out-File -FilePath $env:GITHUB_ENV -Append

          & '${{ steps.sdk.outputs.signtool }}' sign /fd SHA256 /a /f $pfx /p $plainPwd $env:MSIX_FILE

      # ─── Same MSIX flow for the WinUI 3 build ───
      - name: Stage WinUI MSIX layout
        shell: pwsh
        run: |
          $stage = 'publish/msix-winui'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Recurse -Force 'publish/winui/*' $stage
          ./packaging/GenerateAssets.ps1 -OutputDir (Join-Path $stage 'Assets')
          $manifest = Get-Content -Raw packaging/Package.WinUI.appxmanifest
          $manifest = $manifest -replace '#PACKAGE_VERSION#', '${{ steps.ver.outputs.msix_version }}'
          $manifest | Set-Content -Encoding UTF8 (Join-Path $stage 'AppxManifest.xml')

      - name: Pack WinUI MSIX
        shell: pwsh
        run: |
          $msix = "AppleTVRemote-WinUI-${{ steps.ver.outputs.version }}-win-x64.msix"
          & '${{ steps.sdk.outputs.makeappx }}' pack /d publish/msix-winui /p $msix /o
          "MSIX_WINUI_FILE=$msix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign WinUI MSIX
        shell: pwsh
        run: |
          & '${{ steps.sdk.outputs.signtool }}' sign /fd SHA256 /a /f $env:DEV_PFX /p $env:DEV_PFX_PWD $env:MSIX_WINUI_FILE

      # ─── Upload artifacts so they're available even without a release ───
      # All three are continue-on-error so a hit on the account-wide
      # GitHub Actions artifact-storage quota doesn't prevent the
      # GitHub Release upload (which is what actually matters).
      - name: Upload WPF self-contained zip
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wpf-selfcontained
          path: ${{ env.WPF_ZIP }}

      - name: Upload CLI self-contained zip
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cli-selfcontained
          path: ${{ env.CLI_ZIP }}

      - name: Upload WinUI self-contained zip
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: winui-selfcontained
          path: ${{ env.WINUI_ZIP }}

      - name: Upload WPF MSIX
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: msix-wpf
          path: |
            ${{ env.MSIX_FILE }}
            ${{ env.PUB_CERT }}

      - name: Upload WinUI MSIX
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: msix-winui
          path: |
            ${{ env.MSIX_WINUI_FILE }}
            ${{ env.PUB_CERT }}

      # ─── Attach to GitHub Release when run from a tag ───
      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.WPF_ZIP }}
            ${{ env.WINUI_ZIP }}
            ${{ env.CLI_ZIP }}
            ${{ env.MSIX_FILE }}
            ${{ env.MSIX_WINUI_FILE }}
            ${{ env.PUB_CERT }}
          body: |
            ## Apple TV Windows Remote ${{ github.ref_name }}

            **Downloads**

            | Asset | Notes |
            |-------|-------|
            | `AppleTVRemote-Windows-*-win-x64-selfcontained.zip` | Unpackaged self-contained **WPF** tray app (no .NET runtime required) |
            | `AppleTVRemote-WinUI-*-win-x64-selfcontained.zip`   | Unpackaged self-contained **WinUI 3** tray app (no .NET runtime required) |
            | `AppleTVRemote-CLI-*-win-x64-selfcontained.zip`     | Self-contained CLI for scripting / debugging |
            | `AppleTVRemote-Windows-*-win-x64.msix`              | Signed MSIX installer (**WPF** build) |
            | `AppleTVRemote-WinUI-*-win-x64.msix`                | Signed MSIX installer (**WinUI 3** build) |
            | `AppleTVRemote-Windows-*-publisher.cer`             | Public publisher certificate — import to **Local Machine → Trusted Root Certification Authorities** before installing either MSIX |

            > Note: both MSIX packages are signed with the same **dev self-signed cert** generated in CI.
            > Sideloading either MSIX requires trusting the publisher cert first.
            > The WPF and WinUI builds use distinct package identities so they can be installed side-by-side.
