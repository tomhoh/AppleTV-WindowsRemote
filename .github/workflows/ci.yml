name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  protocol-and-cli:
    name: Library + CLI + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore (library + CLI + tests)
        run: |
          dotnet restore src/AppleTVProtocol/AppleTVProtocol.csproj
          dotnet restore src/AppleTVProtocol.Tests/AppleTVProtocol.Tests.csproj
          dotnet restore src/AppleTVRemote.CLI/AppleTVRemote.CLI.csproj

      - name: Build (library + CLI + tests)
        run: |
          dotnet build src/AppleTVProtocol/AppleTVProtocol.csproj            -c Release --no-restore
          dotnet build src/AppleTVProtocol.Tests/AppleTVProtocol.Tests.csproj -c Release --no-restore
          dotnet build src/AppleTVRemote.CLI/AppleTVRemote.CLI.csproj         -c Release --no-restore

      - name: Test
        run: dotnet test src/AppleTVProtocol.Tests/AppleTVProtocol.Tests.csproj -c Release --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test results
        if: always()
        continue-on-error: true   # tolerate account-wide artifact-quota hits
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: src/AppleTVProtocol.Tests/TestResults/*.trx
          if-no-files-found: ignore

  wpf-app:
    name: WPF app (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore WPF project
        run: dotnet restore src/AppleTVRemote.Windows/AppleTVRemote.Windows.csproj

      - name: Build WPF project
        run: dotnet build src/AppleTVRemote.Windows/AppleTVRemote.Windows.csproj -c Release --no-restore
